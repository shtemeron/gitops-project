# ClusterIP only — Gateway API fronts this externally in Stage 6, not yet.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-app
  # ServiceMonitor.spec.selector matches THIS — the Service's own
  # labels — not spec.selector below (that's the pod-selector deciding
  # which pods the Service routes to, a completely separate field).
  # Without this, url-shortener's ServiceMonitor matches zero Services
  # regardless of query wording — confirmed live via "still no data"
  # even after correcting the job-label guess.
  labels:
    app: {{ .Release.Name }}-app
spec:
  selector:
    app: {{ .Release.Name }}-app
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.app.port }}
