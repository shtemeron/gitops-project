# Pulls DB credentials from AWS Secrets Manager via Stage 3's
# ClusterSecretStore, producing a K8s Secret both the app and Postgres
# itself read from — same credentials, two consumers, one source of
# truth. The AWS secret holds a JSON object with "username"/"password"
# keys, generated and owned by Terraform (infra/dbpassword.tf's
# random_password.db) — not set by hand.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.db.secretName }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.db.secretName }}
  data:
    - secretKey: username
      remoteRef:
        key: gitops-project/db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: gitops-project/db-credentials
        property: password
