# One Application, not split per environment — StorageClass is
# cluster-scoped, not namespaced, so there's no dev/prod boundary to
# express at the Application level the way tenancy.yaml has one.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shtemeron/gitops-project.git
    targetRevision: main
    path: k8s-apps/storage
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
