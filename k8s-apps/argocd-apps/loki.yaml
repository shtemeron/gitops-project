# Installed via ArgoCD, not Terraform — same reasoning as observability.yaml.
# Version pinned to 7.3.0 (appVersion 3.6.12), confirmed current via
# Artifact Hub. deploymentMode: SingleBinary — the chart's own docs
# describe this as the fit for "small installs without HA... a few
# tens of GB/day", exactly this project's scale; SimpleScalable/
# Distributed exist for real production log volumes this project will
# never generate.
#
# Bucket name and role ARN are hardcoded, same deliberate tradeoff as
# every other Terraform-known value in k8s-apps/ (see ARCHITECTURE.md
# Stage 6) — both fully deterministic from this project's naming
# convention, not values that change on a rebuild.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.3.0
    helm:
      parameters:
        - name: deploymentMode
          value: SingleBinary
        - name: loki.storage.type
          value: s3
        - name: loki.storage.bucketNames.chunks
          value: gitops-project-loki-100282333708
        - name: loki.storage.s3.region
          value: us-east-1
        - name: serviceAccount.name
          value: loki
        - name: serviceAccount.annotations.eks\.amazonaws\.com/role-arn
          value: arn:aws:iam::100282333708:role/gitops-project-loki
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
