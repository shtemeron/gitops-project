apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-tenancy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shtemeron/gitops-project.git
    targetRevision: main
    path: k8s-apps/tenancy/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
