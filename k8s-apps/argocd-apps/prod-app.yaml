apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shtemeron/gitops-project.git
    targetRevision: main
    path: helm-charts/url-shortener
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  # HPA (Stage 8) owns replica count from here on — without this,
  # selfHeal fights the HPA back to whatever the Deployment template
  # says every time it reconciles. Documented ArgoCD pattern for any
  # HPA-managed Deployment, not project-specific.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
