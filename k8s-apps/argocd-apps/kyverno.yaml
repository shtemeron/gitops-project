# The first platform-level operator installed the GitOps way instead of
# via Terraform helm_release — unlike ArgoCD/ESO/external-dns/the LB
# Controller, Kyverno isn't a prerequisite for GitOps itself to run, so
# it belongs in git like everything else since Stage 4. Chart version
# pinned deliberately to 3.8.2 (appVersion v1.18.2), not the newer 3.9.0
# — that one was published just 4 days before this stage was built and
# hit a persistent OutOfSync diff on its newer CEL-based policy CRDs
# (DeletingPolicy/GeneratingPolicy/ImageValidatingPolicy/MutatingPolicy/
# ValidatingPolicy) even after a successful server-side-apply sync.
# 3.8.2 had 6+ weeks of real-world use before 3.9.0 superseded it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    # Must finish (CRDs installed, chart Healthy) before kyverno-policies.yaml
    # applies any ClusterPolicy — same class of CRD-vs-consumer race
    # documented in ARCHITECTURE.md's Stage 3 postmortem.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.8.2
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Kyverno's ClusterPolicy/Policy/MutatingPolicy CRDs carry OpenAPI
      # schemas large enough that ArgoCD's default client-side apply
      # (which stores the whole manifest in a last-applied-configuration
      # annotation) exceeds Kubernetes' 262144-byte annotation limit —
      # confirmed live: 3 of 19 CRDs failed with exactly that error.
      # Server-side apply tracks ownership via managedFields instead, no
      # annotation involved, so the size limit never applies.
      - ServerSideApply=true
