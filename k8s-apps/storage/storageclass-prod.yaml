# prod: volumes survive their PVC being deleted — the deliberate
# Retain-vs-Delete split from ARCHITECTURE.md's Stage 5.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-prod
provisioner: ebs.csi.aws.com
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: gp3
