# Classic Ingress + ALB — deliberately different from prod's Gateway API,
# both fronted by the same AWS Load Balancer Controller. See
# ARCHITECTURE.md's tech-mapping table for why: demonstrates both the
# legacy and current AWS LB Controller mechanisms side by side, mirroring
# the prior project's own Ingress-vs-Gateway-API comparison exercise.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-app
  namespace: dev
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:100282333708:certificate/844cc37d-7d31-4ad2-944f-a49b9c4925de
    # Default health check path is "/", which this app doesn't handle at
    # all (only /shorten, /<code>, /healthz, /readyz) — would 404 and
    # mark the target unhealthy even with target-type correctly set.
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dev-app-app
                port:
                  number: 80
