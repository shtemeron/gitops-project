# Fires when a Blackbox probe fails for a sustained period — visible in
# Grafana's/Alertmanager's own UI. Deliberately no notification channel
# (Slack/email) wired up: that would mean standing up or paying for an
# external service just to receive a demo alert. The alert actually
# firing and being visible is the proof the mechanism works; a
# notification integration is a separate, well-understood "last mile"
# that doesn't teach anything new about this project's own
# architecture.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: uptime-alerts
  namespace: observability
spec:
  groups:
    - name: uptime
      rules:
        - alert: EndpointDown
          expr: probe_success{job="blackbox-alb-uptime"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.instance }} is down"
            description: "Blackbox probe has failed for {{ $labels.instance }} for more than 2 minutes."
