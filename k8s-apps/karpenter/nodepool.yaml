# Spot-only, per the confirmed decision for Stage 8 — cost-minimizing
# default for a portfolio project with no real production traffic.
# Interruption handling (SQS + EventBridge) is wired up in
# infra/karpenter.tf so pods drain gracefully rather than vanishing on
# a 2-minute reclaim warning. `limits.cpu` is a hard cost ceiling on top
# of HPA's own max-replica ceilings — belt and suspenders.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["t", "c", "m"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
  limits:
    cpu: "8"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
