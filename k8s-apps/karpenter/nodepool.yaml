# Spot-only, per the confirmed decision for Stage 8 — cost-minimizing
# default for a portfolio project with no real production traffic.
# Interruption handling (SQS + EventBridge) is wired up in
# infra/karpenter.tf so pods drain gracefully rather than vanishing on
# a 2-minute reclaim warning. `limits.cpu` is a hard cost ceiling on top
# of HPA's own max-replica ceilings — belt and suspenders.
#
# No instance-generation filter (dropped after hitting it live): an
# original `Gt 4` requirement combined with amd64 silently eliminated
# the entire t-family (t3/t3a are generation 3), including the exact
# family the existing managed node group already runs — confirmed via
# a real "nodepool requirements filtered out all available instance
# types" scheduling failure, not assumed. Over-constraining for what's
# meant to be a small, simple demo project.
#
# No instance-category filter either (dropped after ALSO hitting the
# same "filtered out all available instance types" failure with it in
# place, for completely unrelated pods, after subnets/security-groups/
# AMIs/instance-profile were all independently confirmed healthy via
# EC2NodeClass's own status) — whatever the exact right AWS category
# values are, "t"/"c"/"m" weren't matching anything real. Not worth
# reverse-engineering further for a project this size: capacity-type
# and arch are the constraints that actually matter (Spot cost, and
# matching the AMI's architecture), Karpenter already picks efficiently
# within whatever's left based on the pod's real resource requests.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
  limits:
    cpu: "8"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
