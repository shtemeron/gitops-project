# role (not instanceProfile) — Karpenter creates/manages the instance
# profile itself dynamically using the IAMIntegrationPolicy permissions
# in platform/karpenter.tf. Role name is fully deterministic from this
# project's naming convention (${var.project_name}-eks-node), same
# tradeoff as the other hardcoded values in this directory (see
# ARCHITECTURE.md Stage 6 for why k8s-apps/ can't use Terraform
# templating at all).
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  role: gitops-project-eks-node
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: gitops-project
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: gitops-project
