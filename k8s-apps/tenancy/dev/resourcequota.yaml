# Aggregate ceiling for the whole namespace — the consumption-limiting
# half of tenancy, pairing with role.yaml's access-limiting half. Modest
# on purpose: dev doesn't need prod's headroom.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-quota
  namespace: dev
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "10"
