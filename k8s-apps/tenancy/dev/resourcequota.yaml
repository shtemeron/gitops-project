# Aggregate ceiling for the whole namespace — the consumption-limiting
# half of tenancy, pairing with role.yaml's access-limiting half. Modest
# on purpose: dev doesn't need prod's headroom. Kept at the original
# Stage 4 numbers deliberately (not bumped for Stage 8) — HPA's
# maxReplicas in values-dev.yaml is sized DOWN to fit this ceiling
# instead: (2 CPU limit - Postgres's 500m) / 500m per app pod = 3 app
# pods max, so maxReplicas: 3, not 4.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-quota
  namespace: dev
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "10"
