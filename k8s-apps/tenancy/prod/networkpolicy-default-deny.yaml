# Baseline for the namespace: matches every pod, no ingress/egress rules
# of its own — everything below this file punches explicit holes in it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
