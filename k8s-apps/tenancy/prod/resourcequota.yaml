# Aggregate ceiling for the whole namespace — roughly double dev's, since
# prod is where real traffic eventually lands. Kept at the original
# Stage 4 numbers deliberately (not bumped for Stage 8) — HPA's
# maxReplicas in values-prod.yaml is sized DOWN to fit this ceiling
# instead: (4 CPU limit - Postgres's 500m) / 500m per app pod = 7 app
# pods max, so maxReplicas: 7, not 8.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: prod-quota
  namespace: prod
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "20"
